<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
    
    <style>
        .wufoo {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            margin: 20px auto;
            border: 1px solid #ccc;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        input[type="text"], select {
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #007bff;
        }
        
        input[type="button"] {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        
        input[type="button"]:hover {
            background-color: #0056b3;
        }
        
        /* Style for the custom message box */
        #messageBox {
            display: none;
            padding: 10px;
            margin-top: 15px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <form method="get" action="#" class="wufoo">
        <h2>Order Form</h2>
        <p>What would you like to buy?</p>
        <select>
            <option value="A">A</option>
            <option value="B">B (+ 0.5$)</option>
            <option value="C">C (+ 0.5$)</option>
        </select>

        <p>How many would you like to order?</p>
        <input type="radio" name="rd" id="rd1" value="1"/> <label for="rd1">1 - $10</label> <br/>
        <input type="radio" name="rd" id="rd2" value="2"/> <label for="rd2">2 - $20</label> <br/>
        <input type="radio" name="rd" id="rd3" value="3"/> <label for="rd3">3 - $25</label> <br/>

        <p>Name <span style="color: red">*</span> </p>
        <input type="text" name="firstname" placeholder="FirstName" size="15" required/>
        <input type="text" name="lastname" placeholder="LastName" size="15" required/>
        
        <p>Email</p>
        <input type="text" name="email" size="35"/>
        
        <p>Phone Number</p>
        <input type="text" name="phone1" size="5" maxlength="3"/> -
        <input type="text" name="phone2" size="5" maxlength="3"/> -
        <input type="text" name="phone3" size="5" maxlength="4"/>

        <p><input type="button" name="btSubmit" value="Submit" onclick="showMessage()"/></p>
        
        <div id="messageBox">
            Đã ghi nhận thông tin đặt hàng thành công!
        </div>
    </form>

    <script>
        // Function to show custom message box instead of alert()
        function showMessage() {
            document.getElementById('messageBox').style.display = 'block';
            
            // Hide the message after 3 seconds
            setTimeout(function() {
                document.getElementById('messageBox').style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
