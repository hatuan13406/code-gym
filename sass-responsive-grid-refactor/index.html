<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeGym responsive-grid refactored into Sass.">
  <title>Responsive Grid | Sass Refactor</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Adapted from https://github.com/codegym-vn/responsive-grid -->
  <div class="gridcontainer gridcontainer--demo" aria-hidden="true">
    <div class="gridwrapper gridwrapper--header"><div class="gridcontent gridcontent--header"></div></div>
    <div class="gridwrapper gridwrapper--main">
      <div class="gridcontent gridcontent--sidebar">
        <div class="accent-block"></div>
        <div class="accent-block"></div>
        <div class="accent-block"></div>
        <div class="accent-block"></div>
      </div>
      <div class="gridcontent gridcontent--spacer"></div>
      <div class="gridcontent gridcontent--spacer"></div>
      <div class="gridcontent gridcontent--spacer"></div>
      <div class="gridcontent gridcontent--spacer"></div>
      <div class="gridcontent gridcontent--spacer"></div>
      <div class="gridcontent gridcontent--spacer"></div>
      <div class="gridcontent gridcontent--sidebar">
        <div class="accent-block accent-block--tall"></div>
      </div>
    </div>
    <div class="gridwrapper gridwrapper--footer"><div class="gridcontent gridcontent--footer"></div></div>
  </div>
  <div class="gridcontainer gridcontainer--guides" aria-hidden="true">
    <div class="gridwrapper gridwrapper--guides">
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
      <div class="gridcontent gridcontent--guide"></div>
    </div>
  </div>
  <p>Resize the browser window to see that this grid will respond to the resizing, and always use 100% of the available space.</p>
</body>
</html>
