<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Khảo Sát Khách Hàng</title>
    <style>
        /* CSS Reset và Typography cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #e9e9e9;
            color: #222;
            line-height: 1.5;
            padding: 40px 20px;
        }

        /* Container của form mô phỏng style Wufoo */
        .survey-container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #2979ff; /* Viền trên tạo điểm nhấn */
            border-radius: 4px;
        }

        /* Tiêu đề form */
        .survey-header {
            margin-bottom: 25px;
            border-bottom: 1px dotted #ccc;
            padding-bottom: 15px;
        }

        .survey-header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }

        .survey-header p {
            font-size: 14px;
            color: #666;
        }

        /* Các nhóm trường nhập liệu */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label.field-label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
            color: #333;
        }

        /* Layout cho phần Họ và Tên (2 cột) */
        .name-group {
            display: flex;
            gap: 15px;
        }

        .name-group .col {
            flex: 1;
        }

        .name-group .col span {
            display: block;
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        /* Định dạng các ô input cơ bản */
        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            border-color: #2979ff;
            outline: none;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        /* Định dạng Radio và Checkbox */
        .choice-list {
            list-style: none;
        }

        .choice-list li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .choice-list input {
            margin-right: 10px;
            cursor: pointer;
        }

        .choice-list label {
            cursor: pointer;
            font-size: 14px;
            font-weight: normal;
        }

        /* Nút Submit */
        .btn-submit {
            background-color: #2979ff;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #1c54b2;
        }
        
        /* Đánh dấu sao đỏ cho trường bắt buộc */
        .required {
            color: red;
            margin-left: 3px;
        }
    </style>
</head>
<body>

    <div class="survey-container">
        <div class="survey-header">
            <h1>Khảo sát khách hàng</h1>
            <p>Cảm ơn bạn đã dành thời gian. Ý kiến đóng góp của bạn giúp chúng tôi cải thiện chất lượng dịch vụ tốt hơn.</p>
        </div>

        <form action="#" method="POST">
            
            <!-- Họ và Tên -->
            <div class="form-group">
                <label class="field-label">Họ và tên <span class="required">*</span></label>
                <div class="name-group">
                    <div class="col">
                        <input type="text" name="first_name" required>
                        <span>Tên</span>
                    </div>
                    <div class="col">
                        <input type="text" name="last_name" required>
                        <span>Họ</span>
                    </div>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="field-label" for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <!-- Radio: Đánh giá tổng quan -->
            <div class="form-group">
                <label class="field-label">Mức độ hài lòng của bạn về dịch vụ của chúng tôi?</label>
                <ul class="choice-list">
                    <li><label><input type="radio" name="satisfaction" value="Rất hài lòng" checked> Rất hài lòng</label></li>
                    <li><label><input type="radio" name="satisfaction" value="Hài lòng"> Hài lòng</label></li>
                    <li><label><input type="radio" name="satisfaction" value="Bình thường"> Bình thường</label></li>
                    <li><label><input type="radio" name="satisfaction" value="Không hài lòng"> Không hài lòng</label></li>
                </ul>
            </div>

            <!-- Checkbox: Nguồn biết đến -->
            <div class="form-group">
                <label class="field-label">Bạn biết đến chúng tôi qua kênh nào? (Chọn nhiều)</label>
                <ul class="choice-list">
                    <li><label><input type="checkbox" name="source" value="Facebook"> Mạng xã hội (Facebook, Instagram...)</label></li>
                    <li><label><input type="checkbox" name="source" value="Google"> Tìm kiếm Google</label></li>
                    <li><label><input type="checkbox" name="source" value="Friend"> Bạn bè giới thiệu</label></li>
                    <li><label><input type="checkbox" name="source" value="Other"> Nguồn khác</label></li>
                </ul>
            </div>

            <!-- Textarea: Ý kiến đóng góp -->
            <div class="form-group">
                <label class="field-label" for="feedback">Bạn có góp ý gì thêm để chúng tôi cải thiện không?</label>
                <textarea id="feedback" name="feedback" placeholder="Nhập ý kiến của bạn..."></textarea>
            </div>

            <!-- Nút gửi -->
            <button type="submit" class="btn-submit">Gửi khảo sát</button>

        </form>
    </div>

</body>
</html>
