<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Dropdown Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            padding: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        #menu {
            height: 40px;
            background-color: #000;
            border: 1px solid #333;
        }

        #menu ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #menu > ul {
            display: flex;
        }

        #menu li {
            position: relative;
        }

        #menu > ul > li {
            float: left;
        }

        #menu a {
            display: block;
            min-width: 140px;
            height: 40px;
            padding: 0 18px;
            line-height: 40px;
            color: #fff;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
        }

        #menu a:hover {
            background-color: #e53935;
        }

        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            min-width: 160px;
            background-color: #000;
            visibility: hidden;
            opacity: 0;
            z-index: 1000;
            transition: opacity 0.2s ease;
        }

        #menu ul ul li {
            width: 100%;
            border-bottom: 1px solid #333;
        }

        #menu ul ul a {
            min-width: 180px;
            text-align: left;
        }

        #menu li:hover > ul {
            visibility: visible;
            opacity: 1;
        }

        #menu ul ul ul {
            top: 0;
            left: 100%;
        }
    </style>
</head>

<body>
    <h1>Horizontal Dropdown Menu</h1>

    <nav id="menu">
        <ul>
            <li><a href="#">Home</a></li>

            <li>
                <a href="#">Products</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Phone</a></li>
                    <li><a href="#">Tablet</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Services</a>
                <ul>
                    <li><a href="#">Web Design</a></li>
                    <li><a href="#">SEO</a></li>
                    <li>
                        <a href="#">Development</a>
                        <ul>
                            <li><a href="#">Java</a></li>
                            <li><a href="#">JavaScript</a></li>
                            <li><a href="#">Python</a></li>
                        </ul>
                    </li>
                </ul>
            </li>

            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
