<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .gallery-title {
            text-align: center;
            margin: 35px 0 25px;
            font-weight: 700;
        }

        .gallery-card {
            height: 100%;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .gallery-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .gallery-caption {
            padding: 14px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="gallery-title">Responsive Image Gallery</h1>

        <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="gallery-card">
                    <img src="https://picsum.photos/id/1015/600/400"
                         alt="Phong cảnh núi và sông">
                    <div class="gallery-caption">Mountain View</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="gallery-card">
                    <img src="https://picsum.photos/id/1016/600/400"
                         alt="Phong cảnh thiên nhiên">
                    <div class="gallery-caption">Nature</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="gallery-card">
                    <img src="https://picsum.photos/id/1025/600/400"
                         alt="Chú chó">
                    <div class="gallery-caption">Cute Dog</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="gallery-card">
                    <img src="https://picsum.photos/id/1035/600/400"
                         alt="Bờ biển">
                    <div class="gallery-caption">Sea View</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="gallery-card">
                    <img src="https://picsum.photos/id/1043/600/400"
                         alt="Phong cảnh hồ nước">
                    <div class="gallery-caption">Lake</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="gallery-card">
                    <img src="https://picsum.photos/id/1050/600/400"
                         alt="Cảnh biển">
                    <div class="gallery-caption">Ocean</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="gallery-card">
                    <img src="https://picsum.photos/id/1067/600/400"
                         alt="Con đường">
                    <div class="gallery-caption">Road</div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="gallery-card">
                    <img src="https://picsum.photos/id/1074/600/400"
                         alt="Phong cảnh đồng quê">
                    <div class="gallery-caption">Countryside</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
