<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Dropdown Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        body {
            padding: 40px;
            background-color: #f5f5f5;
        }

        #menu ul {
            margin: 0;
            padding: 0;
        }

        #menu li {
            list-style: none;
            position: relative;
            width: 160px;
            height: 40px;
            padding: 0 20px;
            background-color: #000;
            line-height: 40px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }

        #menu li a {
            display: block;
            text-decoration: none;
            color: #fff;
        }

        #menu li:hover {
            background-color: #e53935;
        }

        #menu li > ul {
            position: absolute;
            top: 0;
            left: 160px;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #menu li:hover > ul {
            visibility: visible;
            opacity: 1;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }
    </style>
</head>

<body>
    <h1>Vertical Dropdown Menu</h1>

    <div id="menu">
        <ul>
            <li>
                <a href="#">Home</a>
            </li>

            <li>
                <a href="#">Products</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Phone</a></li>
                    <li><a href="#">Tablet</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Services</a>
                <ul>
                    <li><a href="#">Web Design</a></li>
                    <li><a href="#">SEO</a></li>
                    <li>
                        <a href="#">Development</a>
                        <ul>
                            <li><a href="#">Java</a></li>
                            <li><a href="#">JavaScript</a></li>
                            <li><a href="#">Python</a></li>
                        </ul>
                    </li>
                </ul>
            </li>

            <li>
                <a href="#">About</a>
            </li>

            <li>
                <a href="#">Contact</a>
            </li>
        </ul>
    </div>
</body>
</html>
