<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <!-- Nhúng file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sử dụng ID cho tiêu đề duy nhất -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Sử dụng Class cho đoạn văn -->
    <p class="description">
        Xin chào! Tôi là một người đam mê công nghệ, thích học hỏi những điều mới và đang trong hành trình trở thành một lập trình viên chuyên nghiệp.
    </p>

    <!-- Danh sách sở thích -->
    <ul>
        <li>Đọc sách và tài liệu công nghệ</li>
        <li>Nghe nhạc thư giãn</li>
        <li>Đi du lịch khám phá</li>
    </ul>

    <!-- Nút bấm -->
    <button class="btn-click">Nhấn vào đây</button>

</body>
</html>
