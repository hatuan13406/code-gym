<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <style>
        /* CSS reset và thiết lập font chữ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Định dạng khung chứa form */
        .form-container {
            background-color: #ffffff;
            width: 400px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333333;
        }

        /* Định dạng các nhóm input */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555555;
        }

        /* Định dạng ô nhập liệu (text, email, tel) */
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus,
        .form-group input[type="tel"]:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* Định dạng phần giới tính (radio buttons) */
        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .gender-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        /* Định dạng nút submit */
        .btn-submit {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Đăng ký tài khoản</h2>
        
        <!-- Form được cài đặt action và method theo đúng yêu cầu -->
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            
            <!-- Trường Họ và tên: name="name" -->
            <div class="form-group">
                <label for="name">Họ và tên</label>
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên của bạn" required>
            </div>

            <!-- Trường Email: name="email" -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required>
            </div>

            <!-- Trường Số điện thoại: name="phone" -->
            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
            </div>

            <!-- Trường Giới tính: name="gender" -->
            <div class="form-group">
                <label>Giới tính</label>
                <div class="gender-group">
                    <label>
                        <input type="radio" name="gender" value="nam" checked> Nam
                    </label>
                    <label>
                        <input type="radio" name="gender" value="nu"> Nữ
                    </label>
                </div>
            </div>

            <!-- Nút gửi form -->
            <button type="submit" class="btn-submit">Đăng Ký</button>

        </form>
    </div>

</body>
</html>
